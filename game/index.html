<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lamplight Keeper</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #02060f; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Lamplight Keeper: swing the lighthouse beam to guide ships home past hidden rocks"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<!-- Plain scripts in order (no modules), so the game also plays opened straight from the disk. -->
<script src="src/rng.js"></script>
<script src="src/config.js"></script>
<script src="src/upgrades.js"></script>
<script src="src/beam.js"></script>
<script src="src/sea.js"></script>
<script src="src/ships.js"></script>
<script src="src/pirates.js"></script>
<script src="src/monster.js"></script>
<script src="src/world.js"></script>
<script src="src/autopilot.js"></script>
<script src="src/scene.js"></script>
<script src="src/effects.js"></script>
<script src="src/render.js"></script>
<script src="src/hud.js"></script>
<script src="src/screens.js"></script>
<script src="src/audio.js"></script>
<script src="src/input.js"></script>
<script src="src/storage.js"></script>
<script src="src/shots.js"></script>
<script src="src/main.js"></script>
</body>
</html>
